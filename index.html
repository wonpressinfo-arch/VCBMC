<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071327" />
  <meta name="description" content="한국CBMC 인천V지회 창립대회 모바일 초대장" />
  <meta property="og:title" content="한국CBMC 인천V지회 창립대회" />
  <meta property="og:description" content="2026.09.01(화) 18:30 · 송도 센트럴파크 호텔 2층 루비홀" />
  <title>한국CBMC 인천V지회 창립대회</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#030914;overflow:hidden}
    #inviteFrame{display:block;width:100%;height:100dvh;border:0;background:#030914}
  </style>
</head>
<body>
  <iframe id="inviteFrame" src="index-legacy.html" title="한국CBMC 인천V지회 창립대회 모바일 초대장"></iframe>
  <script>
  (function(){
    const frame=document.getElementById('inviteFrame');
    const phoneIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.7 9 3l2.2 5.1-1.6 1.3a15.4 15.4 0 0 0 5 5l1.3-1.6L21 15l-.7 2.4c-.4 1.3-1.6 2.1-3 2-7.1-.7-12.9-6.5-13.6-13.6-.1-1.4.7-2.6 2-3z"/></svg>';
    const officialCbmcLogo='./assets/korea-cbmc-logo-white.png';

    function person(role,name,phone,tel){
      return '<div class="contact-person">'+
        '<p class="contact-role">'+role+'</p>'+
        '<p class="contact-name">'+name+'</p>'+
        '<a class="contact-phone" href="tel:'+tel+'" aria-label="'+name+' '+role+'에게 전화하기">'+phoneIcon+'<span>'+phone+'</span></a>'+
      '</div>';
    }

    function member(name,phone,tel,role){
      return '<div class="contact-member">'+
        '<p class="contact-name">'+name+'</p>'+
        '<a class="contact-phone" href="tel:'+tel+'" aria-label="'+name+' '+role+'에게 전화하기">'+phoneIcon+'<span>'+phone+'</span></a>'+
      '</div>';
    }

    frame.addEventListener('load',function(){
      const d=frame.contentDocument;
      if(!d) return;

      const heroTitle=d.querySelector('#hero-title');
      if(heroTitle) heroTitle.innerHTML='<span style="letter-spacing:0;word-spacing:0;white-space:nowrap">한국CBMC</span><br />인천V지회<br />창립대회';
      const heroMeta=d.querySelector('.hero-meta');
      if(heroMeta) heroMeta.textContent='2026.09.01(화) 18:30';
      const heroPlace=d.querySelector('.hero-place');
      if(heroPlace) heroPlace.innerHTML='송도 센트럴파크 호텔<br><span class="hero-room">2층 루비홀</span>';

      const locationTitle=d.querySelector('#location-title');
      if(locationTitle) locationTitle.textContent='송도 센트럴파크 호텔';
      const locationCopy=d.querySelector('.location-copy');
      if(locationCopy){
        let room=locationCopy.querySelector('.location-room');
        if(!room){
          room=d.createElement('p');
          room.className='location-room';
          const address=locationCopy.querySelector('p');
          locationCopy.insertBefore(room,address||null);
        }
        room.textContent='2층 루비홀';
      }

      d.querySelectorAll('.cbmc-logo').forEach(function(img){
        img.src=officialCbmcLogo;
        img.alt='한국CBMC';
        img.removeAttribute('srcset');
        img.style.clipPath='none';
      });

      const programRows=d.querySelectorAll('.program-row');
      if(programRows.length>=3){
        programRows[0].innerHTML='<span>1부</span><span>―</span><strong>식사</strong>';
        programRows[1].innerHTML='<span>2부</span><span>―</span><strong>경건회 및 창립대회</strong>';
        programRows[2].innerHTML='<span>3부</span><span>―</span><strong>특별순서</strong>';
      }

      d.querySelector('#support')?.remove();

      const supportNav=[...d.querySelectorAll('.sticky-nav a')].find(a=>a.getAttribute('href')==='#support');
      if(supportNav){supportNav.setAttribute('href','#contact');supportNav.textContent='문의';}

      const blocks=[...d.querySelectorAll('#rsvp .info-block')];
      const inquiry=blocks.find(b=>b.querySelector('h3')?.textContent.trim()==='행사문의');
      if(inquiry){
        const p=inquiry.querySelector('p');
        if(p) p.innerHTML='총무 김윤태 대표<br>010-8012-1738';
      }

      const list=d.querySelector('#contact .contact-list');
      if(list){
        list.innerHTML=
          person('중앙회 지회창립본부 본부장','최병목','010-5252-1383','01052521383')+
          person('인천/북인천 지회창립 위원장','최준호','010-3720-1803','01037201803')+
          person('인천연합회장','박봉용','010-3716-2721','01037162721')+
          person('파송지회 인천남부지회장','손남주','010-3799-4662','01037994662')+
          '<div class="contact-person contact-person-group"><p class="contact-role">창립준비위원장</p>'+
            member('최성모','010-8894-3220','01088943220','창립준비위원장')+
            member('원동혁','010-6300-5961','01063005961','창립준비위원장')+
          '</div>'+
          '<div class="contact-person contact-person-group"><p class="contact-role">창립 지회장</p>'+
            member('최낙훈','010-7447-0328','01074470328','창립 지회장')+
            member('정지혜','010-8899-1719','01088991719','창립 지회장')+
          '</div>';
      }

      const style=d.createElement('style');
      style.textContent='.contact-person-group .contact-member + .contact-member{margin-top:22px;padding-top:22px;border-top:1px solid rgba(239,207,131,.22)}.contact-person-group .contact-name{margin-bottom:10px}.cbmc-logo{transform:scale(.90);transform-origin:center center}.program-list{width:min(620px,100%)!important}.program-row{grid-template-columns:.72fr .22fr 2.35fr!important;font-size:clamp(22px,5.8vw,42px)!important}.program-row strong,.program-row>span{font-size:1em!important;line-height:1.2!important}.program-row strong{white-space:nowrap!important;letter-spacing:-.02em}.hero-room{display:inline-block;margin-top:7px;font-size:.82em;font-weight:700;letter-spacing:.08em}.location-room{margin:8px 0 4px!important;color:#efcf83!important;font-size:clamp(20px,5vw,28px)!important;font-weight:800!important;letter-spacing:.06em}';
      d.head.appendChild(style);
    });
  })();
  </script>
</body>
</html>
